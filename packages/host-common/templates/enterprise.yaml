name: enterprise
schemaVersion: 1
packages:
  - { id: "@agnes/ai", source: "builtin" }
  - { id: "@agnes/base", source: "builtin" }
  - { id: "@agnes/enterprise", source: "builtin" }
  - { id: "@agnes/connector-db", source: "builtin" }
  - { id: "@agnes/connector-kb", source: "builtin" }
providers:
  approval: { provider: "local-prompt" }
  checkpoint: { provider: "fs" }
  billing: { provider: "budget" }
  verifier: { provider: "t0" }
  repair: { provider: "default" }
  artifacts: { provider: "local" }
  principals: { provider: "enterprise" }
provider:
  package: "@agnes/ai"
adapters:
  storage: sqlite
  fs: local
  exec: local
  platform: host
  secrets: { kind: file, path: /etc/agnes/secrets }
transports:
  - { kind: unix }
dataDir: /var/lib/agnes
cacheDir: /var/cache/agnes
limits: { "jobs.tick_ms": 1000, "shutdown.grace_ms": 10000, "sandbox.required": 1 }
computerUse:
  enabled: false
  appAccess: allowlist
  appAllowlist: []
  capture: { allowFullDesktop: false, maxImageDimension: 1456, maxBytesPerImage: 4194304, maxImagesPerResult: 1, maxImagesPerMutationResult: 2, maxImagesPerModelRequest: 4, maxCapturesPerHour: 120 }
  retention: { maxRecentPerSession: 100, ttlMs: 86400000, gcIntervalMs: 3600000, maxExtendedTtlMs: 604800000, globalMaxBytes: 1073741824 }
presets: { default: standard, allowed: [standard, ptc] }
permissions: { default: workspace-write, allowed: [read-only, workspace-write, full-access] }
policy:
  capabilityCeiling: ["services", "tools", "hooks", "slots", "projections", "events", "resources", "ui", "network", "artifacts", "subagent", "exec", "filesystem.read", "filesystem.write", "model", "childAgents", "secrets", "credentials", "device", "uiData"]
  workspacePackages: require-project-trust

name: local-dev
schemaVersion: 1
provider:
  package: "@agnes/ai"
  routes:
    - route: faux
      api: openai-completions
      baseUrl: SEA_BASE_URL
      credentialRef: secret://test/wire
      models:
        - id: faux-1
          name: faux-1
          api: openai-completions
          route: faux
          baseUrl: SEA_BASE_URL
          reasoning: false
          input: [text, image]
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
          contextWindow: 128000
          maxTokens: 8192
          toolCallFormats: [native]
          thinkingReplay: native
          contract_id: null
adapters:
  storage: sqlite
  fs: local
  exec: local
  platform: host
  secrets: { kind: file }
transports: [{ kind: stdio }]
limits: { "jobs.tick_ms": 1000, "shutdown.grace_ms": 10000 }
presets: { default: standard, allowed: [standard] }
policy:
  capabilityCeiling: [tools, hooks, slots, events, resources, network, network.publicRead, tools.invoke, artifacts, subagent]
  workspacePackages: require-project-trust

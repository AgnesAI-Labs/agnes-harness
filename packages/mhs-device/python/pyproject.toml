[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agnes-mhs"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<17"]
description = "Device SDK for the Agnes MHS/MOS preview protocol"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agnes_mhs = ["schema.json", "py.typed"]

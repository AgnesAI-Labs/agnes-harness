<!doctype html>
<html lang="en" data-agnes-shell="workbench">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="agnes-csp-nonce" content="__AGNES_CSP_NONCE__" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta id="agnes-config" data-ws="__AGNES_WS_URL__" />
    <title>Agnes Harness</title>
    <!-- 阻塞式（非 module）：必须在首次绘制前定好主题，否则会闪一帧浅色。
         CSP 为 script-src 'self' 且无 unsafe-inline，内联脚本会被拦。 -->
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/antd.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <!-- WC5：平台共享单例 import map。说明符集合构建期固定；本脚本体被 web-server 以 SHA-256
         计入 CSP script-src（严格哈希，不放宽策略）。手工修改本块后必须重新构建使哈希一致。 -->
    <script type="importmap">
{
  "imports": {
    "react": "/vendor/react.js",
    "react/jsx-runtime": "/vendor/react-jsx-runtime.js",
    "react-dom": "/vendor/react-dom.js",
    "react-dom/client": "/vendor/react-dom-client.js",
    "antd": "/vendor/antd.js",
    "recharts": "/vendor/recharts.js",
    "antd/locale/en_US.js": "/vendor/antd-en-us.js",
    "antd/locale/zh_CN.js": "/vendor/antd-zh-cn.js",
    "@agnes/web-ui": "/vendor/web-ui.js",
    "@agnes/web-ui/conversation": "/vendor/conversation.js",
    "@agnes/web-ui/x": "/vendor/x.js",
    "@agnes/cordis": "/vendor/cordis.js",
    "@agnes/web-client": "/vendor/web-client.js",
    "@agnes/protocol": "/vendor/protocol.js",
    "@agnes/sdk/browser": "/vendor/sdk-browser.js",
    "@agnes/sdk": "/vendor/sdk-browser.js",
    "@agnes/web-units/shell": "/vendor/web-units-shell.js",
    "@agnes/web-foundation/locale-catalog": "/vendor/web-locale-catalog.js",
    "@agnes/web-conversation/goal-renderers": "/vendor/goal-renderers.js",
    "@agnes/web-conversation/interaction-renderer": "/vendor/interaction-renderer.js",
    "@agnes/web/presentation-renderers": "/vendor/presentation-renderers.js"
  }
}
    </script>
    <script type="module" src="/app.js"></script>
  </head>
  <body data-agnes-region="app">
    <div id="app-root"></div>
  </body>
</html>

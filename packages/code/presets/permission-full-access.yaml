# Permission overlay, explicit opt-in: ordinary tool approvals are disabled; private providers can
# still require OS isolation. Principal authorization and hard secret/integrity denials remain
# authoritative. Merged after a recipe; it writes permission-axis fields only.
name: permission-full-access
approval: { command_policy: [] }
sandbox: { level: L0, on_unavailable: allow }
subagent: { isolation: worktree }
providers:
  tool-policy: { provider: full-access }

# The default recipe: the model emits tool calls directly and the standard tool set answers them.
# The permission (tool policy, approval rules, sandbox, subagent isolation) is not written here: it is
# merged after this recipe from presets/permission-*.yaml. Everything else not written here is
# inherited from base.yaml; the tool list is spelled out anyway so that a byte snapshot of this file
# reads as a complete description of the product's defaults.
name: standard
extends: base
surfaces: [cli, sdk, acp, daemon]
model:
  contract_id: agnes-model-contract@v1
  # Compaction follows the session's primary model unless a deployment explicitly selects it.
  # Image and video are absent, which means "not supported here".
  # `default` is a placeholder on both fields: the deployment's adapter list decides which provider
  # and which model it resolves to. A product recipe never names a concrete model.
  route:
    primary: { route: default, model: default }
    escalation: { route: default, model: default }
    fast: { route: default, model: default }
    verifier: { route: default, model: default }
  prompt_sections: [persona, environment, coding-doctrine]
disclosure: standard
tools: { core: [read, write, edit, shell, grep, find, ls, todo, web_fetch, web_search, ask_user_question, ui_render, ui_update, ui_close, ui_submit, present, job_output, job_list, job_kill, schedule_create, schedule_list, schedule_update, schedule_delete] }
mcp: { defer: true }
# No cumulative step ceiling: completion, cancellation and failure end a normal task.
budget: { per_request_cap: 4000, max_steps: null }
subagent: { max_depth: 1, max_fan_out: 4 }
ext_ui: { input: prompt, unattended: decline }
hooks: [session_start, tool_call, tool_result, format_deviation]

# Permission overlay: read tools only; the policy also rejects changes through deferred or
# third-party tools. Merged after a recipe; it writes permission-axis fields only.
name: permission-read-only
approval: { command_policy: [] }
sandbox: { level: L1, on_unavailable: allow-if-unimplemented }
subagent: { isolation: shared }
providers:
  tool-policy: { provider: read-only }

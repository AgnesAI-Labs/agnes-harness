# Permission overlay: workspace writes, closed command network, shell approvals. Merged after a recipe.
# It writes permission-axis fields only (tool policy, approval rules, sandbox level, subagent
# isolation); `sandbox.required` and `approval.on_unavailable` stay with the recipe.
name: permission-workspace-write
approval:
  # Editing and writing inside the workspace is pre-approved; every shell command is still asked.
  #
  # What argv actually is, which is what the previous version of this rule got wrong. The evaluator
  # is handed the containment-checked ABSOLUTE path, always - never the workspace-relative one, and
  # never the raw string the model wrote. A path that resolves outside the workspace never reaches a
  # rule at all: it is refused as non-canonical at the producing end and becomes a question for the
  # operator. So this rule is the second half of a pair, and containment is the other half's job. A
  # rule written against a relative spelling matched nothing and pre-approved nothing, while the
  # session refused to open at all, because an allow rule that a relative path can satisfy is one
  # resolved against a working directory it never saw.
  #
  # This rule decides what runs *without asking a human*, so it is written as an allowlist, not as a
  # list of spellings to refuse. A blocklist over an unnormalised string loses to the next spelling
  # nobody thought of; a positive shape only ever loses to something it was never taught to accept,
  # and that failure is "ask the operator", which is the safe direction.
  #
  # The shape: anchored at both ends, a leading `/`, then one or more `/`-joined components, each
  # component non-empty and built only from characters that are neither a separator nor a control
  # character (so no backslash, no NUL, no tab, no newline, no NEL, no LINE/PARAGRAPH SEPARATOR).
  # This POSIX rule excludes the Windows family (`\Windows\x`, `\\server\share`,
  # `\\?\C:\x`), the empty-component family (`//etc`, `a//b`, a trailing `/`) and every
  # line-terminator smuggling of a `..` segment, because a path carrying one of those bytes no longer
  # matches at all. Every relative spelling - `src/a.ts`, `../outside`, `~/.ssh/config`, `C:x` - fails
  # the leading `/` and is asked.
  #
  # Deliberately still pre-approved: `weird..name/x.ts`, `a..b`, `...` - `..` inside a name does not
  # escape anything. So are `%2e%2e/etc` and a U+FF0E look-alike of `../etc`: on disk those are
  # ordinary directory names, not a parent reference.
  #
  # The `..` lookahead scans with `[\s\S]`, not `.`: `.` stops at a line terminator in every engine
  # that might compile this string, which is exactly how an earlier version of this rule let
  # `x\n/../../etc/passwd` through. The component alphabet already excludes those bytes, so the
  # lookahead is belt to its braces rather than the only defence. It sits before the leading `/` is
  # consumed so that `/../x` is inside its reach.
  #
  # This is the auto-approval gate only; the sandbox write domain is the second gate behind it, and
  # denied paths inside the workspace are refused there even though this rule pre-approves them.
  # The two additional rules accept canonical Windows drive/UNC paths after containment checks.
  command_policy:
    - tool: 'edit|write'
      argv: '^/(?!(?:[\s\S]*/)?\.\.(?:/|$))(?:[^/\\\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+/)*[^/\\\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+$'
      action: allow
    - tool: 'edit|write'
      argv: '^[A-Z]:/(?!(?:[\s\S]*/)?\.\.(?:/|$))(?:[^/\\:\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+/)*[^/\\:\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+$'
      action: allow
    - tool: 'edit|write'
      argv: '^//(?!(?:[\s\S]*/)?\.\.(?:/|$))[^/\\:\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+/[^/\\:\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+/(?:[^/\\:\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+/)*[^/\\:\x00-\x1F\x7F\u0080-\u009F\u2028\u2029]+$'
      action: allow
# Use OS confinement when implemented; failed probes never permit unconfined execution.
sandbox: { level: L1, on_unavailable: allow-if-unimplemented }
subagent: { isolation: worktree }
providers:
  tool-policy: { provider: default }

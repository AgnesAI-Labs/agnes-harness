name: Web E2E
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [nightly, gate, benchmark]
        default: nightly
        description: Full nightly browsers, regular browser gate or build-transfer measurement
  # ci.yml owns the single daily schedule; this workflow also accepts explicit manual runs.
  workflow_call:
    inputs:
      suite: { type: string, default: nightly }
      types: { type: string, default: '' }
      native-linux: { type: string, default: '' }
      local-linux: { type: string, default: '' }
      macos-matrix: { type: string, default: '' }
      linux-matrix: { type: string, default: '' }
permissions: { contents: read }
env:
  AGNES_NATIVE_BUILDER: glibc228
concurrency:
  group: web-e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web-native-linux:
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: ubuntu-24.04
      artifact: ${{ inputs.native-linux || '' }}
  web-native-macos:
    uses: ./.github/workflows/ci-native.yml
    with: { runner: macos-15 }
  web-types:
    needs: web-native-linux
    uses: ./.github/workflows/ci-web-types.yml
    with:
      artifact: ${{ inputs.types || '' }}
      native: ${{ needs.web-native-linux.outputs.artifact }}
      nightly: ${{ inputs.suite == 'nightly' }}
  web-local-linux:
    if: inputs.suite != 'benchmark'
    needs: [web-types, web-native-linux]
    uses: ./.github/workflows/ci-local.yml
    with:
      runner: ubuntu-24.04
      types: ${{ needs.web-types.outputs.artifact }}
      native: ${{ needs.web-native-linux.outputs.artifact }}
      artifact: ${{ inputs.local-linux || '' }}
  web-local-macos:
    if: inputs.suite != 'benchmark'
    needs: [web-types, web-native-macos]
    uses: ./.github/workflows/ci-local.yml
    with:
      runner: macos-15
      types: ${{ needs.web-types.outputs.artifact }}
      native: ${{ needs.web-native-macos.outputs.artifact }}
  web-quality-linux:
    if: inputs.suite != 'benchmark'
    needs: [web-types, web-native-linux]
    uses: ./.github/workflows/ci-web-quality.yml
    with:
      runner: ubuntu-24.04
      types: ${{ needs.web-types.outputs.artifact }}
      native: ${{ needs.web-native-linux.outputs.artifact }}
  web-quality-macos:
    if: inputs.suite != 'benchmark'
    needs: [web-types, web-native-macos]
    uses: ./.github/workflows/ci-web-quality.yml
    with:
      runner: macos-15
      types: ${{ needs.web-types.outputs.artifact }}
      native: ${{ needs.web-native-macos.outputs.artifact }}
  local-sharing-linux:
    if: inputs.suite == 'benchmark'
    needs: [web-types, web-native-linux]
    uses: ./.github/workflows/ci-local-benchmark.yml
    with:
      runner: ubuntu-24.04
      types: ${{ needs.web-types.outputs.artifact }}
      native: ${{ needs.web-native-linux.outputs.artifact }}
  local-sharing-macos:
    if: inputs.suite == 'benchmark'
    needs: [web-types, web-native-macos]
    uses: ./.github/workflows/ci-local-benchmark.yml
    with:
      runner: macos-15
      types: ${{ needs.web-types.outputs.artifact }}
      native: ${{ needs.web-native-macos.outputs.artifact }}
  # Explicit file/flow lists use hosted-macOS 15 timings, including build and quality prechecks.
  # Isolate narrow flows and candidate review; retain every scan and the ten-minute step budget.
  # Screenshots are uploaded as evidence only: there is no pixel gate on macOS or Linux.
  # A spec too long for one job is split by title: a --grep list and its exact --grep-invert.
  e2e-web:
    name: macOS Web E2E (${{ matrix.id }})
    needs: [web-types, web-native-macos, web-quality-macos, web-local-macos]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.macos-matrix || needs.web-types.outputs.macos-matrix) }}
    if: inputs.suite != 'narrow-nightly' && inputs.suite != 'benchmark'
    runs-on: macos-15
    timeout-minutes: 15
    steps: &macos-web-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run doctor:toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.web-types.outputs.artifact }}
          path: .agnes-tmp/prepared-types
      - run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-types
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.web-native-macos.outputs.artifact }}
          path: .agnes-tmp/prepared-native
      - name: Restore and load native helpers
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - name: Restore Chromium cache
        id: browser-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.63.0
      # Provisioning may use the network. The gate itself uses only local fixtures and cached Chromium.
      - name: Provision pinned Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.web-local-macos.outputs.artifact }}
          path: .agnes-tmp/prepared-local
      - name: Restore shared local runtime
        id: local
        run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-local
      - name: Browser batch 1 (${{ matrix.batches[0].id }}, zero retries)
        if: ${{ !cancelled() && steps.local.outcome == 'success' && matrix.batches[0] != null }}
        timeout-minutes: ${{ matrix.batches[0].timeoutMinutes || 10 }}
        env:
          CI_WEB_BATCH: ${{ toJSON(matrix.batches[0]) }}
        run: node tools/e2e-web/run-ci-batch.mjs --prepared-local packages/cli/dist/local/.ci-preparation
      - name: Browser batch 2 (${{ matrix.batches[1].id }}, zero retries)
        if: ${{ !cancelled() && steps.local.outcome == 'success' && matrix.batches[1] != null }}
        timeout-minutes: ${{ matrix.batches[1].timeoutMinutes || 10 }}
        env:
          CI_WEB_BATCH: ${{ toJSON(matrix.batches[1]) }}
        run: node tools/e2e-web/run-ci-batch.mjs --prepared-local packages/cli/dist/local/.ci-preparation
      - name: Browser batch 3 (${{ matrix.batches[2].id }}, zero retries)
        if: ${{ !cancelled() && steps.local.outcome == 'success' && matrix.batches[2] != null }}
        timeout-minutes: ${{ matrix.batches[2].timeoutMinutes || 10 }}
        env:
          CI_WEB_BATCH: ${{ toJSON(matrix.batches[2]) }}
        run: node tools/e2e-web/run-ci-batch.mjs --prepared-local packages/cli/dist/local/.ci-preparation
      - name: Upload report, screenshots, traces and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-macos-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Only completed reports/traces; Playwright scratch files can disappear during teardown.
          path: |
            .agnes-tmp/e2e-web
            !.agnes-tmp/e2e-web/**/.playwright-artifacts-*/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  e2e-web-linux:
    name: Linux Web E2E (${{ matrix.id }})
    needs: [web-types, web-native-linux, web-quality-linux, web-local-linux]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.linux-matrix || needs.web-types.outputs.linux-matrix) }}
    if: inputs.suite != 'narrow-nightly' && inputs.suite != 'benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: &linux-web-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Native toolchain and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 bubblewrap fonts-dejavu-core fonts-dejavu-mono
      - name: Provision actual Linux sandbox namespaces
        run: bash tools/e2e-web/provision-linux-sandbox.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run doctor:toolchain
        id: install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.web-types.outputs.artifact }}
          path: .agnes-tmp/prepared-types
      - run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-types
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.web-native-linux.outputs.artifact }}
          path: .agnes-tmp/prepared-native
      - name: Restore and load native helpers
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - name: Restore Chromium cache
        id: browser-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.63.0
      - name: Provision pinned Chromium and system libraries
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.web-local-linux.outputs.artifact }}
          path: .agnes-tmp/prepared-local
      - name: Restore shared local runtime
        id: local
        run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-local
      - name: Browser batch 1 (${{ matrix.batches[0].id }}, zero retries)
        if: ${{ !cancelled() && steps.local.outcome == 'success' && matrix.batches[0] != null }}
        timeout-minutes: ${{ matrix.batches[0].timeoutMinutes || 10 }}
        env:
          CI_WEB_BATCH: ${{ toJSON(matrix.batches[0]) }}
        run: node tools/e2e-web/run-ci-batch.mjs --prepared-local packages/cli/dist/local/.ci-preparation
      - name: Browser batch 2 (${{ matrix.batches[1].id }}, zero retries)
        if: ${{ !cancelled() && steps.local.outcome == 'success' && matrix.batches[1] != null }}
        timeout-minutes: ${{ matrix.batches[1].timeoutMinutes || 10 }}
        env:
          CI_WEB_BATCH: ${{ toJSON(matrix.batches[1]) }}
        run: node tools/e2e-web/run-ci-batch.mjs --prepared-local packages/cli/dist/local/.ci-preparation
      - name: Browser batch 3 (${{ matrix.batches[2].id }}, zero retries)
        if: ${{ !cancelled() && steps.local.outcome == 'success' && matrix.batches[2] != null }}
        timeout-minutes: ${{ matrix.batches[2].timeoutMinutes || 10 }}
        env:
          CI_WEB_BATCH: ${{ toJSON(matrix.batches[2]) }}
        run: node tools/e2e-web/run-ci-batch.mjs --prepared-local packages/cli/dist/local/.ci-preparation
      - name: Upload report, screenshots, traces and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-linux-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Only completed reports/traces; Playwright scratch files can disappear during teardown.
          path: |
            .agnes-tmp/e2e-web
            !.agnes-tmp/e2e-web/**/.playwright-artifacts-*/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  web-e2e-gate:
    name: Web E2E gate
    needs: [web-types, web-native-linux, web-native-macos, web-local-linux, web-local-macos, web-quality-linux, web-quality-macos, e2e-web, e2e-web-linux, e2e-web-narrow-nightly, e2e-web-linux-narrow-nightly]
    if: always() && inputs.suite != 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .node-version }
      - run: node tools/ci/dedup-routing.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          WEB_SUITE: ${{ inputs.suite }}
  # The full narrow matrix owns every locale/theme at all three widths in the nightly suite.
  # One case takes 8-9 minutes on hosted runners, so the gate step gets
  # 20 minutes here; the steps are the platform jobs' own (YAML anchors), not a copy.
  e2e-web-narrow-nightly:
    name: macOS Web E2E nightly (${{ matrix.id }})
    needs: [web-types, web-native-macos, web-quality-macos, web-local-macos]
    if: inputs.suite == 'nightly' || inputs.suite == 'narrow-nightly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"id": "narrow-en-light", "batches": [{"id": "narrow-en-light", "args": ["narrow.spec.ts", "--grep", "en/light$"], "widths": "", "timeoutMinutes": 20}]}
          - {"id": "narrow-en-dark", "batches": [{"id": "narrow-en-dark", "args": ["narrow.spec.ts", "--grep", "en/dark$"], "widths": "", "timeoutMinutes": 20}]}
          - {"id": "narrow-zh-CN-light", "batches": [{"id": "narrow-zh-CN-light", "args": ["narrow.spec.ts", "--grep", "zh-CN/light$"], "widths": "", "timeoutMinutes": 20}]}
          - {"id": "narrow-zh-CN-dark", "batches": [{"id": "narrow-zh-CN-dark", "args": ["narrow.spec.ts", "--grep", "zh-CN/dark$"], "widths": "", "timeoutMinutes": 20}]}
    runs-on: macos-15
    timeout-minutes: 30
    steps: *macos-web-steps
  e2e-web-linux-narrow-nightly:
    name: Linux Web E2E nightly (${{ matrix.id }})
    needs: [web-types, web-native-linux, web-quality-linux, web-local-linux]
    if: inputs.suite == 'nightly' || inputs.suite == 'narrow-nightly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"id": "narrow-en-light", "batches": [{"id": "narrow-en-light", "args": ["narrow.spec.ts", "--grep", "en/light$"], "widths": "", "timeoutMinutes": 20}]}
          - {"id": "narrow-en-dark", "batches": [{"id": "narrow-en-dark", "args": ["narrow.spec.ts", "--grep", "en/dark$"], "widths": "", "timeoutMinutes": 20}]}
          - {"id": "narrow-zh-CN-light", "batches": [{"id": "narrow-zh-CN-light", "args": ["narrow.spec.ts", "--grep", "zh-CN/light$"], "widths": "", "timeoutMinutes": 20}]}
          - {"id": "narrow-zh-CN-dark", "batches": [{"id": "narrow-zh-CN-dark", "args": ["narrow.spec.ts", "--grep", "zh-CN/dark$"], "widths": "", "timeoutMinutes": 20}]}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: *linux-web-steps

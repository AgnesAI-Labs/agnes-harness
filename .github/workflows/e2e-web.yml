name: Web E2E
on:
  pull_request:
  push:
    branches: [main, feat/agh-plugin-core, feat/agh-e2e-gate]
  merge_group:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: web-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e-web:
    name: Web E2E gate
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore Chromium cache
        id: browser-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.63.0
      # Provisioning may use the network. The gate itself uses only local fixtures and cached Chromium.
      - name: Provision pinned Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Real daemon and Web gate (zero retries)
        timeout-minutes: 10
        run: pnpm e2e:web
      - name: Upload report, screenshots, traces and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agnes-tmp/e2e-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

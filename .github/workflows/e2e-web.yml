name: Web E2E
on:
  pull_request:
  push:
    branches: [main, feat/agh-plugin-core, feat/agh-e2e-gate, feat/agh-e2e-ui-gate, fix/agh-linux, fix/agh-ci-green, fix/agh-ci-green-2]
  merge_group:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: web-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e-web:
    name: macOS Web E2E (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6] }
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore Chromium cache
        id: browser-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.63.0
      # Provisioning may use the network. The gate itself uses only local fixtures and cached Chromium.
      - name: Provision pinned Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Real daemon and Web gate (zero retries)
        timeout-minutes: 10
        run: pnpm e2e:web --shard=${{ matrix.shard }}/6 --workers=1
      - name: Upload report, screenshots, traces and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-macos-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agnes-tmp/e2e-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  e2e-web-linux:
    name: Linux Web E2E (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6] }
    # Visual baselines use this image and its explicitly provisioned font families.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: pnpm }
      - name: Native toolchain and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev python3 bubblewrap fonts-dejavu-core fonts-dejavu-mono
      - run: pnpm install --frozen-lockfile
        id: install
      - name: Native helpers
        id: native
        run: |
          pnpm --filter @agnes/host build:native
          pnpm --filter @agnes/system-node build:native
      - name: Restore Chromium cache
        id: browser-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.63.0
      - name: Provision pinned Chromium and system libraries
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Build local runtime
        id: build
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          pnpm --filter @agnes/cli build:local
          node --input-type=module -e 'import { sourceHash, recordBuild } from "./tools/e2e-web/build-cache.mjs"; await recordBuild(await sourceHash())'
      - name: Real daemon and Web gate (zero retries)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        timeout-minutes: 10
        run: pnpm e2e:web --reuse-build --shard=${{ matrix.shard }}/6 --workers=1
      - name: Upload report, screenshots, traces and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-linux-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agnes-tmp/e2e-web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  linux-contracts:
    name: Linux tests and structural guards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.20.0, cache: pnpm }
      - name: Native toolchain and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev python3 bubblewrap
      - run: pnpm install --frozen-lockfile
        id: install
      - name: Native helpers
        id: native
        run: |
          pnpm --filter @agnes/host build:native
          pnpm --filter @agnes/system-node build:native
      - name: Typecheck production and fixtures
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: pnpm typecheck
      # Reviewed structural checks remain hard gates; unremeasured line budgets are reported debt.
      - name: Fast tests
        env: { AGH_RATCHET_REPORT: '1' }
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: pnpm test
      - name: Repository guards (line-budget debt report-only)
        env: { AGH_RATCHET_REPORT: '1' }
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: pnpm exec vitest run tools/guards/src --maxWorkers=1
      - name: Linux kernel identity regression
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: pnpm exec vitest run packages/host-infrastructure/test/process-identity-linux.e2e.test.ts packages/base/extensions/sandbox/test/backend-linux.e2e.test.ts packages/package-manager/test/local-watcher.slow.test.ts packages/host-infrastructure/test/adapters/storage-lock.e2e.test.ts --maxWorkers=1
  web-e2e-gate:
    name: Web E2E gate
    needs: [e2e-web, e2e-web-linux, linux-contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every platform, shard and contract check
        env:
          MACOS_RESULT: ${{ needs.e2e-web.result }}
          LINUX_RESULT: ${{ needs.e2e-web-linux.result }}
          CONTRACTS_RESULT: ${{ needs.linux-contracts.result }}
        run: |
          test "$MACOS_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$CONTRACTS_RESULT" = success

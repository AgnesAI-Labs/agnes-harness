name: Prepare Web declarations
on:
  workflow_call:
    inputs:
      artifact: { type: string, default: '' }
      native: { type: string, required: true }
    outputs:
      artifact: { value: '${{ jobs.prepare.outputs.artifact }}' }
      macos-matrix: { value: '${{ jobs.prepare.outputs.macos-matrix }}' }
      linux-matrix: { value: '${{ jobs.prepare.outputs.linux-matrix }}' }
permissions: { contents: read }
env: { AGNES_NATIVE_BUILDER: glibc228 }
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      macos-matrix: ${{ steps.matrix.outputs.macos-matrix }}
      linux-matrix: ${{ steps.matrix.outputs.linux-matrix }}
    steps:
      - id: identity
        env: { EXISTING: '${{ inputs.artifact }}' }
        run: echo "artifact=${EXISTING:-prepared-types-${{ github.run_id }}-${{ github.run_attempt }}}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.artifact == ''
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: inputs.artifact == ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.artifact == ''
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: inputs.artifact == ''
      - run: pnpm run doctor:toolchain
        if: inputs.artifact == ''
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.artifact == ''
        with:
          name: ${{ inputs.native }}
          path: .agnes-tmp/prepared-native
      - name: Restore native helpers
        if: inputs.artifact == ''
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - name: Types and repository guards
        if: inputs.artifact == ''
        run: |
          pnpm typecheck
          pnpm exec tsc -b tools/e2e-web
          pnpm exec vitest run tools/guards/src --maxWorkers=1
      - id: matrix
        if: inputs.artifact == ''
        run: node tools/ci/web-matrix.mjs
      - name: Pack declarations
        if: inputs.artifact == ''
        run: node tools/ci/prepared-artifact.mjs pack types .agnes-tmp/prepared-types
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.artifact == ''
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .agnes-tmp/prepared-types
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

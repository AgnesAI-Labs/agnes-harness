name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  # Nightly run of every job, including the heavy tier on all three platforms.
  schedule:
    - cron: '0 18 * * *'
permissions: { contents: read }
env:
  AGNES_NATIVE_BUILDER: glibc228
# The event name keeps a nightly run on main and a push to main from cancelling each other. Only a
# newer push to the same pull request cancels its older run; runs on main always finish, because
# they carry the only macOS and Windows heavy-tier results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version }
      - id: scope
        run: node tools/ci/scope.mjs
  static:
    name: static checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - run: pnpm lint
      - run: node tools/public-docs/verify.mjs
      # Vitest's global setup refuses to collect any file until the native helpers are built for
      # this runner (tools/native-test-setup.mjs), including the repository policy files below.
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      # File/function ceilings and Host identity allowances are hard, compared with the protected base.
      # scope-line-count.test.ts only reports scope LOC deltas; growth is not a failure.
      - name: documentation examples and repository policy
        run: >-
          pnpm exec vitest run tools/ci tools/public-docs/examples.test.ts
          tools/guards/src --maxWorkers=1
      - run: pnpm typecheck
        if: needs.changes.outputs.docs-only != 'true'
      - run: pnpm gen:check
        if: needs.changes.outputs.docs-only != 'true'
      - name: verify working tree is clean
        run: git diff --exit-code
  check:
    name: check (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # The three Windows shards must carry the same testExclude, or the shards overlap or leave gaps.
        include:
          - { os: ubuntu-latest, label: ubuntu-latest, testArgs: '--maxWorkers=1 --pool=forks', testExclude: '', shard: '' }
          - { os: macos-latest, label: macos-latest, testArgs: '--maxWorkers=2', testExclude: '', shard: '' }
          - { os: windows-latest, label: 'windows-latest shard 1/3', testArgs: '--maxWorkers=2 --shard=1/3', testExclude: 'packages/daemon/test/skill-install-requests.slow.test.ts,packages/daemon/test/windows-startup-directories.test.ts,packages/daemon/test/conversation-mcp.e2e.test.ts', shard: '1/3' }
          - { os: windows-latest, label: 'windows-latest shard 2/3', testArgs: '--maxWorkers=2 --shard=2/3', testExclude: 'packages/daemon/test/skill-install-requests.slow.test.ts,packages/daemon/test/windows-startup-directories.test.ts,packages/daemon/test/conversation-mcp.e2e.test.ts', shard: '2/3' }
          - { os: windows-latest, label: 'windows-latest shard 3/3', testArgs: '--maxWorkers=2 --shard=3/3', testExclude: 'packages/daemon/test/skill-install-requests.slow.test.ts,packages/daemon/test/windows-startup-directories.test.ts,packages/daemon/test/conversation-mcp.e2e.test.ts', shard: '3/3' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Keep the same committed LF bytes on every platform, including Windows.
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      # The completion tests load the generated script in real bash and zsh. macOS ships zsh;
      # the Ubuntu image does not.
      - name: install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      # This repository-owned script is a no-op off macOS. Dependencies stay script-disabled; only
      # the reviewed libproc helper needed by Host process identity is built explicitly.
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      # Bound worker fan-out so hundreds of isolated test files do not exhaust small hosted runners.
      # Split Windows files across three runners while keeping two workers per runner.
      # The fast tier discovers and runs the complete Protocol fixture tree through the same
      # conformance core as the package CLI, so a newly added fixture cannot bypass CI. The heavy
      # tier (*.e2e.test.ts, *.slow.test.ts) runs in its own job below.
      - name: test fast tier (includes Protocol conformance)
        id: suite
        # Files run alone below on Windows are held out here.
        env: { AGNES_TEST_EXCLUDE: '${{ matrix.testExclude }}' }
        run: pnpm exec vitest run --project fast ${{ matrix.testArgs }}
      # The Skill install flow polls for completion with a three-second bound; run this
      # disk-backed integration file without other Vitest files competing on Windows.
      - name: Windows Skill install requests
        if: runner.os == 'Windows' && matrix.shard == '2/3'
        run: pnpm exec vitest run packages/daemon/test/skill-install-requests.slow.test.ts --maxWorkers=1
      # These files drive real daemon startup and MCP server processes under fixed startup and
      # shutdown deadlines; run each alone so parallel Vitest files do not starve them.
      - name: Windows daemon startup directories
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        run: pnpm exec vitest run packages/daemon/test/windows-startup-directories.test.ts --maxWorkers=1
      - name: Windows conversation MCP registration
        if: runner.os == 'Windows' && matrix.shard == '2/3'
        run: pnpm exec vitest run packages/daemon/test/conversation-mcp.e2e.test.ts --maxWorkers=1
      # Keep boot/session creation in the functional gate above. The isolated run reports wall-clock
      # time in the job summary even if another test fails; a stable performance runner can opt into
      # the 300 ms assertion. Do not restart this test after a cancelled or skipped suite.
      - name: startup budget (shared-runner diagnostic)
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' && (runner.os != 'Windows' || matrix.shard == '1/3') }}
        env: { AGH_BOOT_BUDGET_REPORT: '1' }
        run: pnpm exec vitest run packages/cli/test/boot-budget.test.ts --maxWorkers=1
      - name: build local acceptance package on each platform
        if: ${{ runner.os != 'Windows' || matrix.shard == '1/3' }}
        run: pnpm --filter @agnes/cli build:local
      - name: verify packaged directory publication capability
        if: ${{ runner.os != 'Windows' || matrix.shard == '1/3' }}
        run: node packages/system-node/scripts/check-directory-publication.mjs packages/cli/dist/local/node_modules/@agnes/system-node/dist/native/agnes-system.node
      - name: verify local delivery with Windows PowerShell 5.1
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        shell: powershell
        env:
          AGNES_LOCAL_CLI: ${{ github.workspace }}/packages/cli/dist/local/agnes.mjs
        run: |
          $env:AGNES_ACCEPTANCE_POWERSHELL = (Get-Process -Id $PID).Path
          if (-not $env:AGNES_ACCEPTANCE_POWERSHELL) { throw 'Cannot identify the acceptance PowerShell process' }
          pnpm exec vitest run tools/acceptance/shared-local-delivery.e2e.test.ts
      - name: verify local delivery with PowerShell 7
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        shell: pwsh
        env:
          AGNES_LOCAL_CLI: ${{ github.workspace }}/packages/cli/dist/local/agnes.mjs
        run: |
          $env:AGNES_ACCEPTANCE_POWERSHELL = (Get-Process -Id $PID).Path
          if (-not $env:AGNES_ACCEPTANCE_POWERSHELL) { throw 'Cannot identify the acceptance PowerShell process' }
          pnpm exec vitest run tools/acceptance/shared-local-delivery.e2e.test.ts
      # Installation and builds must not rewrite committed source or the lockfile.
      - name: verify working tree is clean
        run: git diff --exit-code
  windows-check-result:
    # Preserve the existing required check name; this job needs every platform test shard.
    name: check (windows-latest)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All platform test shards passed."
  # Real daemon, worker and CLI process tests, and large-ledger or timer-bound tests. Every PR runs
  # them on Linux; pushes to main, the nightly schedule and manual runs cover all three platforms.
  heavy:
    name: heavy (${{ matrix.os }} ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        # With the sandbox, shells, built CLI and Chromium provisioned, one Linux runner needed
        # 45-60 minutes for the whole tier. Shards 1 and 2 are the file lists in
        # tools/ci/heavy-shards.json, each about 20 minutes of measured Linux file time; shard 3 runs
        # every other heavy file, so each file runs in exactly one shard.
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    # Matches the check job. Windows runs its heavy files one at a time.
    timeout-minutes: 60
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The upgrade gate archives pinned earlier plugin-core commits.
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      # Heavy tests confine real sessions, MCP children and candidate tests with bubblewrap, and
      # drive a persistent zsh. The Ubuntu image ships neither, and its AppArmor policy blocks the
      # unprivileged user namespaces bwrap needs; the script authorizes only /usr/bin/bwrap.
      - name: Linux sandbox and shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap zsh
          bash tools/e2e-web/provision-linux-sandbox.sh
      # The template scaffold tests link the preview SDK packages from their emitted declarations
      # (docs/extend/quickstart.md, plus web-client for tool-with-panel). Only these projects
      # are built, not the whole repository.
      - name: build preview SDK declarations
        run: pnpm exec tsc -b packages/plugin-runtime packages/protocol packages/resource-control-runtime packages/web-client
      # The demo, agent-sweep and built-distribution gates start packages/cli/dist/local.
      - run: pnpm --filter @agnes/cli build:local
      # The multi-tab transport and agent-sweep tests launch the pinned Playwright Chromium.
      - name: provision pinned Chromium
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # Source-worker tests share jiti's transpile cache (packages/daemon/test/source-transpile-cache.ts).
      # jiti re-transpiles any file whose source hash changed, so an older cache is safe to restore.
      - name: Restore source transpile cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: node_modules/.cache/agnes-source-transpile
          key: source-transpile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: source-transpile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      # These tests start real processes and are the most sensitive to a loaded runner, so they
      # run with less file fan-out than the fast tier. The check job spreads Windows files over
      # three runners, but this job holds every heavy file on one; two at a time there starved each
      # other's process startup, shutdown and file-handle release, so Windows runs them one at a
      # time. Linux also reserves a CPU for Vite and child-process setup. The files run alone
      # below on Windows are held out here.
      - name: test heavy tier
        env:
          AGNES_TEST_EXCLUDE: ${{ runner.os == 'Windows' && 'packages/cli/test/acp-concurrency.e2e.test.ts,packages/cli/test/dbh-m06-ephemeral-leak.e2e.test.ts,packages/daemon/test/service-worker.e2e.test.ts,packages/cli/test/built-resource-mcp.e2e.test.ts' || '' }}
        run: node tools/ci/run-heavy-shard.mjs --shard=${{ matrix.shard }}/3 --maxWorkers=${{ runner.os == 'macOS' && 2 || 1 }}
      - name: Save source transpile cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: node_modules/.cache/agnes-source-transpile
          key: source-transpile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}-${{ matrix.shard }}
      # The ACP cold-start bound measures concurrent CLI processes. Run it without other Vitest
      # files competing for this runner's cores, while retaining its original assertion.
      - name: Windows ACP cold-start concurrency
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/cli/test/acp-concurrency.e2e.test.ts --maxWorkers=1
      # The source CLI fixture cold-loads the test Host; keep its 20-second initialization
      # deadline meaningful by running it without other Vitest files on this Windows runner.
      - name: Windows ephemeral CLI lifecycle
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/cli/test/dbh-m06-ephemeral-leak.e2e.test.ts --maxWorkers=1
      # These heavy files drive real worker, MCP server and built CLI processes under fixed startup and
      # shutdown deadlines; run each alone so parallel Vitest files do not starve them.
      - name: Windows service worker boundary
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/daemon/test/service-worker.e2e.test.ts --maxWorkers=1
      - name: Windows built CLI managed MCP lifecycle
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/cli/test/built-resource-mcp.e2e.test.ts --maxWorkers=1
      - name: verify working tree is clean
        run: git diff --exit-code
  runtime-package:
    name: runtime package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - run: pnpm --filter @agnes/cli build:runtime
      - run: pnpm --filter @agnes/daemon build:runtime
      # This source-level Host test loads native seams outside the packaged extension runner, and
      # Vitest's global setup requires both native products (tools/native-test-setup.mjs).
      - name: build source native modules for assembly acceptance
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @agnes/host build:native
          pnpm --filter @agnes/system-node build:native
      - name: exercise opt-in assembly with packaged runtime
        if: runner.os == 'macOS'
        run: pnpm exec vitest run packages/host/test/assemble/enabled-packages.test.ts
        env:
          AGNES_TEST_RUNTIME_DIRECTORY: packages/cli/dist/agnes-runtime
      - run: pnpm --filter @agnes/cli pack --pack-destination .agnes-tmp/packs
      - run: pnpm --filter @agnes/daemon pack --pack-destination .agnes-tmp/packs
      - name: verify source tree is unchanged
        run: git diff --exit-code
  sea:
    name: SEA (${{ matrix.target }})
    needs: [changes, static, check]
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64, binary: agnes-darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64, binary: agnes-linux-x64 }
          - { os: windows-2022, target: win32-x64, binary: agnes-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      - run: pnpm --filter @agnes/cli build:sea
      - name: verify Linux ABI and SHA-256 in Node, workers and SEA on Debian 11
        if: runner.os == 'Linux'
        run: |
          node --test tools/native/check-glibc.test.mjs
          node packages/cli/sea/build-native-smoke.mjs "$RUNNER_TEMP/agnes-native-smoke"
          docker run --rm --network=none -v "$PWD/packages/cli/dist/sea:/dist:ro" -v "$PWD/tools/native:/probe:ro" debian:bullseye-slim /dist/runtime/node /probe/crypto-smoke.cjs /dist/node_modules/@agnes/system-node/dist/native/agnes-system.node
          docker run --rm --network=none -v "$PWD/packages/cli/dist/sea:/dist:ro" -v "$RUNNER_TEMP/agnes-native-smoke:/probe:ro" debian:bullseye-slim /probe/crypto-smoke /dist/node_modules/@agnes/system-node/dist/native/agnes-system.node
      - name: smoke production commands, extensions and native runtime
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.e2e.test.ts sea/windows-runtime.test.ts
        env:
          AGNES_SEA_BIN: dist/sea/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      # The executable needs its daemon, worker, web assets and Node/native runtime beside it.
      # Tar also preserves executable permissions for the macOS/Linux distribution.
      - name: archive complete SEA runtime
        run: tar --exclude=sea-loader-smoke-* -czf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea .
      - name: extract distribution for delivery acceptance
        run: |
          node -e "require('node:fs').mkdirSync('packages/cli/dist/sea-unpacked', {recursive:true})"
          tar -xzf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea-unpacked
      - name: smoke extracted distribution
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.e2e.test.ts sea/windows-runtime.test.ts sea/web-distribution.test.ts --maxWorkers=1
        env:
          AGNES_SEA_BIN: dist/sea-unpacked/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnes-${{ matrix.target }}
          path: packages/cli/dist/agnes-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  result:
    name: CI result
    if: always()
    needs: [changes, static, check, windows-check-result, heavy, runtime-package, sea]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version }
      - name: require every selected job to pass
        run: node tools/ci/result.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

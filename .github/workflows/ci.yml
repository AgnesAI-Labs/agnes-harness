name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - id: scope
        run: node tools/ci/scope.mjs
  static:
    name: static checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: node tools/public-docs/verify.mjs
      - name: documentation examples and repository policy
        run: >-
          pnpm exec vitest run tools/ci tools/public-docs/examples.test.ts
          tools/guards/src --maxWorkers=1
      - run: pnpm typecheck
        if: needs.changes.outputs.docs-only != 'true'
      - run: pnpm gen:check
        if: needs.changes.outputs.docs-only != 'true'
      - name: verify working tree is clean
        run: git diff --exit-code
  check:
    name: check (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: ubuntu-latest, testArgs: '--maxWorkers=4', shard: '' }
          - { os: macos-latest, label: macos-latest, testArgs: '--maxWorkers=2', shard: '' }
          - { os: windows-latest, label: 'windows-latest shard 1/3', testArgs: '--maxWorkers=2 --shard=1/3 --exclude=packages/cli/test/acp-concurrency.test.ts --exclude=packages/cli/test/dbh-m06-ephemeral-leak.test.ts', shard: '1/3' }
          - { os: windows-latest, label: 'windows-latest shard 2/3', testArgs: '--maxWorkers=2 --shard=2/3 --exclude=packages/cli/test/acp-concurrency.test.ts --exclude=packages/cli/test/dbh-m06-ephemeral-leak.test.ts', shard: '2/3' }
          - { os: windows-latest, label: 'windows-latest shard 3/3', testArgs: '--maxWorkers=2 --shard=3/3 --exclude=packages/cli/test/acp-concurrency.test.ts --exclude=packages/cli/test/dbh-m06-ephemeral-leak.test.ts', shard: '3/3' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Keep the same committed LF bytes on every platform, including Windows.
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      # This repository-owned script is a no-op off macOS. Dependencies stay script-disabled; only
      # the reviewed libproc helper needed by Host process identity is built explicitly.
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      # Bound worker fan-out so hundreds of isolated test files do not exhaust small hosted runners.
      # Split Windows files across three runners while keeping two workers per runner.
      # The root Vitest gate discovers and runs the complete Protocol fixture tree through the same
      # conformance core as the package CLI, so a newly added fixture cannot bypass CI.
      - name: test (includes Protocol conformance)
        id: suite
        run: pnpm exec vitest run ${{ matrix.testArgs }}
      # The ACP cold-start bound measures eight concurrent CLI processes. Run it without other
      # Vitest files competing for this runner's cores, while retaining its original assertion.
      - name: Windows ACP cold-start concurrency
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        run: pnpm exec vitest run packages/cli/test/acp-concurrency.test.ts --maxWorkers=1
      # The source CLI fixture cold-loads the test Host; keep its 20-second initialization
      # deadline meaningful by running it without other Vitest files on this Windows runner.
      - name: Windows ephemeral CLI lifecycle
        if: runner.os == 'Windows' && matrix.shard == '3/3'
        run: pnpm exec vitest run packages/cli/test/dbh-m06-ephemeral-leak.test.ts --maxWorkers=1
      # Keep boot/session creation in the functional gate above. The isolated run reports wall-clock
      # time in the job summary even if another test fails; a stable performance runner can opt into
      # the 300 ms assertion. Do not restart this test after a cancelled or skipped suite.
      - name: startup budget (shared-runner diagnostic)
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' && (runner.os != 'Windows' || matrix.shard == '1/3') }}
        env: { AGH_BOOT_BUDGET_REPORT: '1' }
        run: pnpm exec vitest run packages/cli/test/boot-budget.test.ts --maxWorkers=1
      - name: build local acceptance package on each platform
        if: ${{ runner.os != 'Windows' || matrix.shard == '1/3' }}
        run: pnpm --filter @agnes/cli build:local
      - name: verify packaged directory publication capability
        if: ${{ runner.os != 'Windows' || matrix.shard == '1/3' }}
        run: node packages/system-node/scripts/check-directory-publication.mjs packages/cli/dist/local/node_modules/@agnes/system-node/dist/native/agnes-system.node
      - name: verify local delivery with Windows PowerShell 5.1
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        shell: powershell
        env:
          AGNES_LOCAL_CLI: ${{ github.workspace }}/packages/cli/dist/local/agnes.mjs
        run: |
          $env:AGNES_ACCEPTANCE_POWERSHELL = (Get-Process -Id $PID).Path
          if (-not $env:AGNES_ACCEPTANCE_POWERSHELL) { throw 'Cannot identify the acceptance PowerShell process' }
          pnpm exec vitest run tools/acceptance/shared-local-delivery.test.ts
      - name: verify local delivery with PowerShell 7
        if: runner.os == 'Windows' && matrix.shard == '1/3'
        shell: pwsh
        env:
          AGNES_LOCAL_CLI: ${{ github.workspace }}/packages/cli/dist/local/agnes.mjs
        run: |
          $env:AGNES_ACCEPTANCE_POWERSHELL = (Get-Process -Id $PID).Path
          if (-not $env:AGNES_ACCEPTANCE_POWERSHELL) { throw 'Cannot identify the acceptance PowerShell process' }
          pnpm exec vitest run tools/acceptance/shared-local-delivery.test.ts
      # Installation and builds must not rewrite committed source or the lockfile.
      - name: verify working tree is clean
        run: git diff --exit-code
  windows-check-result:
    # Preserve the existing required check name; this job needs every platform test shard.
    name: check (windows-latest)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All platform test shards passed."
  runtime-package:
    name: runtime package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @agnes/cli build:runtime
      - run: pnpm --filter @agnes/daemon build:runtime
      - name: exercise opt-in assembly with packaged runtime
        if: runner.os == 'macOS'
        run: pnpm exec vitest run packages/host/test/assemble/enabled-packages.test.ts
        env:
          AGNES_TEST_RUNTIME_DIRECTORY: packages/cli/dist/agnes-runtime
      - run: pnpm --filter @agnes/cli pack --pack-destination .agnes-tmp/packs
      - run: pnpm --filter @agnes/daemon pack --pack-destination .agnes-tmp/packs
      - name: verify source tree is unchanged
        run: git diff --exit-code
  sea:
    name: SEA (${{ matrix.target }})
    needs: [changes, static, check]
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, binary: agnes-darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64, binary: agnes-linux-x64 }
          - { os: windows-2022, target: win32-x64, binary: agnes-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      - run: pnpm --filter @agnes/cli build:sea
      - name: smoke production commands, extensions and native runtime
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.test.ts sea/windows-runtime.test.ts
        env:
          AGNES_SEA_BIN: dist/sea/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      # The executable needs its daemon, worker, web assets and Node/native runtime beside it.
      # Tar also preserves executable permissions for the macOS/Linux distribution.
      - name: archive complete SEA runtime
        run: tar --exclude=sea-loader-smoke-* -czf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea .
      - name: extract distribution for delivery acceptance
        run: |
          node -e "require('node:fs').mkdirSync('packages/cli/dist/sea-unpacked', {recursive:true})"
          tar -xzf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea-unpacked
      - name: smoke extracted distribution
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.test.ts sea/windows-runtime.test.ts sea/web-distribution.test.ts --maxWorkers=1
        env:
          AGNES_SEA_BIN: dist/sea-unpacked/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnes-${{ matrix.target }}
          path: packages/cli/dist/agnes-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  result:
    name: CI result
    if: always()
    needs: [changes, static, check, windows-check-result, runtime-package, sea]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: require every selected job to pass
        run: node tools/ci/result.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

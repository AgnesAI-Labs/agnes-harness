name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Windows runners otherwise rewrite the checkout to CRLF before Biome sees it. Configure Git
      # before checkout so every matrix member validates the same committed LF bytes.
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      # This repository-owned script is a no-op off macOS. Dependencies stay script-disabled; only
      # the reviewed libproc helper needed by Host process identity is built explicitly.
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      - run: pnpm lint
      - run: node tools/public-docs/verify.mjs
      - run: pnpm typecheck
      # Bound worker fan-out so hundreds of isolated test files do not exhaust small hosted runners.
      # Windows has slower process and filesystem operations, so use less parallelism and a bounded
      # 10-second test timeout there. Measure startup without competing test workers.
      # The root Vitest gate discovers and runs the complete Protocol fixture tree through the same
      # conformance core as the package CLI, so a newly added fixture cannot bypass CI.
      - name: test (includes Protocol conformance)
        if: runner.os != 'Windows'
        run: pnpm exec vitest run --maxWorkers=4
      - name: test (includes Protocol conformance)
        if: runner.os == 'Windows'
        run: pnpm exec vitest run --maxWorkers=2 --testTimeout=10000 --exclude packages/cli/test/boot-budget.test.ts
      - name: verify startup budget without competing tests
        if: runner.os == 'Windows'
        run: pnpm exec vitest run packages/cli/test/boot-budget.test.ts --maxWorkers=1
      - name: build local acceptance package on each platform
        run: pnpm --filter @agnes/cli build:local
      - name: verify packaged directory publication capability
        run: node packages/system-node/scripts/check-directory-publication.mjs packages/cli/dist/local/node_modules/@agnes/system-node/dist/native/agnes-system.node
      - name: verify local delivery with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AGNES_LOCAL_CLI: ${{ github.workspace }}/packages/cli/dist/local/agnes.mjs
        run: |
          $env:AGNES_ACCEPTANCE_POWERSHELL = (Get-Process -Id $PID).Path
          if (-not $env:AGNES_ACCEPTANCE_POWERSHELL) { throw 'Cannot identify the acceptance PowerShell process' }
          pnpm exec vitest run tools/acceptance/shared-local-delivery.test.ts
      - name: verify local delivery with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGNES_LOCAL_CLI: ${{ github.workspace }}/packages/cli/dist/local/agnes.mjs
        run: |
          $env:AGNES_ACCEPTANCE_POWERSHELL = (Get-Process -Id $PID).Path
          if (-not $env:AGNES_ACCEPTANCE_POWERSHELL) { throw 'Cannot identify the acceptance PowerShell process' }
          pnpm exec vitest run tools/acceptance/shared-local-delivery.test.ts
      - run: pnpm gen:check
      # 台账 R13：install / gen:check 之后工作树若被写脏（如 lockfile 的 workspace importer
      # 被重写），此前的 workflow 抓不到。git diff 本身会打印差异并以非零退出，且命令
      # 在 POSIX shell 与 PowerShell 中一致，避免三平台矩阵依赖 bash 语法。
      - name: verify working tree is clean
        run: git diff --exit-code
  runtime-package:
    name: runtime package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @agnes/cli build:runtime
      - run: pnpm --filter @agnes/daemon build:runtime
      - name: exercise opt-in assembly with packaged runtime
        if: runner.os == 'macOS'
        run: pnpm exec vitest run packages/host/test/assemble/enabled-packages.test.ts
        env:
          AGNES_TEST_RUNTIME_DIRECTORY: packages/cli/dist/agnes-runtime
      - run: pnpm --filter @agnes/cli pack --pack-destination .agnes-tmp/packs
      - run: pnpm --filter @agnes/daemon pack --pack-destination .agnes-tmp/packs
      - name: verify source tree is unchanged
        run: git diff --exit-code
  sea:
    name: SEA (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, binary: agnes-darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64, binary: agnes-linux-x64 }
          - { os: windows-2022, target: win32-x64, binary: agnes-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      - run: pnpm --filter @agnes/cli build:sea
      - name: smoke production commands, extensions and native runtime
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.test.ts sea/windows-runtime.test.ts
        env:
          AGNES_SEA_BIN: dist/sea/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      # The executable needs its daemon, worker, web assets and Node/native runtime beside it.
      # Tar also preserves executable permissions for the macOS/Linux distribution.
      - name: archive complete SEA runtime
        run: tar --exclude=sea-loader-smoke-* -czf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea .
      - name: extract distribution for delivery acceptance
        run: |
          node -e "require('node:fs').mkdirSync('packages/cli/dist/sea-unpacked', {recursive:true})"
          tar -xzf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea-unpacked
      - name: smoke extracted distribution
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.test.ts sea/windows-runtime.test.ts sea/web-distribution.test.ts --maxWorkers=1
        env:
          AGNES_SEA_BIN: dist/sea-unpacked/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnes-${{ matrix.target }}
          path: packages/cli/dist/agnes-${{ matrix.target }}.tar.gz
          if-no-files-found: error

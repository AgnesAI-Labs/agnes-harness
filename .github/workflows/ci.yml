name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  # Nightly run of every job, including the heavy tier on all three platforms.
  schedule:
    - cron: '0 18 * * *'
permissions: { contents: read }
env:
  AGNES_NATIVE_BUILDER: glibc228
# The event name keeps a nightly run on main and a push to main from cancelling each other. Only a
# newer push to the same pull request cancels its older run; runs on main always finish, because
# they carry the only macOS and Windows heavy-tier results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
      web: ${{ steps.web.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version }
      - id: scope
        run: node tools/ci/scope.mjs
      - id: web
        run: node tools/ci/dedup-routing.mjs select
  static:
    name: static checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      types: ${{ steps.prepared.outputs.types }}
      native: ${{ steps.prepared.outputs.native }}
      macos-matrix: ${{ steps.prepared.outputs.macos-matrix }}
      linux-matrix: ${{ steps.prepared.outputs.linux-matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - run: pnpm lint
      - run: node tools/public-docs/verify.mjs
      # Vitest's global setup refuses to collect any file until the native helpers are built for
      # this runner (tools/native-test-setup.mjs), including the repository policy files below.
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      # File/function ceilings and Host identity allowances are hard, compared with the protected base.
      # scope-line-count.test.ts only reports scope LOC deltas; growth is not a failure.
      - name: documentation examples and repository policy
        run: >-
          pnpm exec vitest run tools/ci tools/public-docs/examples.test.ts
          tools/guards/src --maxWorkers=1
      - run: pnpm typecheck
      - run: pnpm exec tsc -b tools/e2e-web
      - id: prepared
        run: |
          echo "types=prepared-types-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "native=prepared-native-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          node tools/ci/prepared-artifact.mjs pack types .agnes-tmp/prepared-types
          node tools/ci/prepared-artifact.mjs pack native .agnes-tmp/prepared-native
          node tools/ci/web-matrix.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepared.outputs.types }}
          path: .agnes-tmp/prepared-types
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepared.outputs.native }}
          path: .agnes-tmp/prepared-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - run: pnpm gen:check
        if: needs.changes.outputs.docs-only != 'true'
      - name: verify working tree is clean
        run: git diff --exit-code
  native-linux:
    needs: static
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: ubuntu-latest
      artifact: ${{ needs.static.outputs.native }}
  native-macos:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-native.yml
    with: { runner: macos-latest }
  native-windows:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-native.yml
    with: { runner: windows-latest }
  local-linux:
    needs: [changes, static, native-linux]
    uses: ./.github/workflows/ci-local.yml
    with:
      runner: ubuntu-latest
      native: ${{ needs.native-linux.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
  local-macos:
    needs: [changes, static, native-macos]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-local.yml
    with:
      runner: macos-latest
      native: ${{ needs.native-macos.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
  local-windows:
    needs: [changes, static, native-windows]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-local.yml
    with:
      runner: windows-latest
      native: ${{ needs.native-windows.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
  linux-fast:
    needs: [changes, static, native-linux]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-linux-fast.yml
    with:
      types: ${{ needs.static.outputs.types }}
      native: ${{ needs.native-linux.outputs.artifact }}
  web:
    needs: [changes, static, native-linux, local-linux]
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/e2e-web.yml
    with:
      types: ${{ needs.static.outputs.types }}
      native-linux: ${{ needs.native-linux.outputs.artifact }}
      local-linux: ${{ needs.local-linux.outputs.artifact }}
      macos-matrix: ${{ needs.static.outputs.macos-matrix }}
      linux-matrix: ${{ needs.static.outputs.linux-matrix }}
      external-fast: ${{ needs.changes.outputs.docs-only != 'true' }}
      external-heavy: ${{ needs.changes.outputs.docs-only != 'true' }}
  web-result:
    name: Web E2E gate
    needs: [changes, static, linux-fast, heavy, web]
    if: always() && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          WEB: ${{ needs.web.result }}
          STATIC: ${{ needs.static.result }}
          FAST: ${{ needs.linux-fast.result }}
          HEAVY: ${{ needs.heavy.result }}
          DOCS: ${{ needs.changes.outputs.docs-only }}
        run: |
          test "$WEB" = success
          test "$STATIC" = success
          if [ "$DOCS" = true ]; then test "$FAST" = skipped && test "$HEAVY" = skipped
          elif [ "$DOCS" = false ]; then test "$FAST" = success && test "$HEAVY" = success
          else exit 1; fi
  check-linux:
    needs: [changes, static, native-linux, local-linux]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-platform-check.yml
    with:
      runner: ubuntu-latest
      native: ${{ needs.native-linux.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
      local: ${{ needs.local-linux.outputs.artifact }}
      shards: '[""]'
  check-macos:
    needs: [changes, static, native-macos, local-macos]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-platform-check.yml
    with:
      runner: macos-latest
      native: ${{ needs.native-macos.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
      local: ${{ needs.local-macos.outputs.artifact }}
      shards: '["1/3","2/3","3/3"]'
  check-windows:
    needs: [changes, static, native-windows, local-windows]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-platform-check.yml
    with:
      runner: windows-latest
      native: ${{ needs.native-windows.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
      local: ${{ needs.local-windows.outputs.artifact }}
      shards: '["1/3","2/3","3/3"]'
  check:
    name: check results
    needs: [changes, check-linux, check-macos, check-windows]
    if: always() && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .node-version }
      - run: node tools/ci/dedup-routing.mjs platforms
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          PLATFORM_LAYER: check
  windows-check-result:
    # Preserve the existing required check name; this job needs every platform test shard.
    name: check (windows-latest)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All platform test shards passed."
  # Real daemon, worker and CLI process tests, and large-ledger or timer-bound tests. Every PR runs
  # them on Linux; pushes to main, the nightly schedule and manual runs cover all three platforms.
  heavy-linux:
    needs: [changes, static, native-linux, local-linux]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-platform-heavy.yml
    with:
      runner: ubuntu-latest
      native: ${{ needs.native-linux.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
      local: ${{ needs.local-linux.outputs.artifact }}
  heavy-macos:
    needs: [changes, static, native-macos, local-macos]
    if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci-platform-heavy.yml
    with:
      runner: macos-latest
      native: ${{ needs.native-macos.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
      local: ${{ needs.local-macos.outputs.artifact }}
  heavy-windows:
    needs: [changes, static, native-windows, local-windows]
    if: needs.changes.outputs.docs-only != 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci-platform-heavy.yml
    with:
      runner: windows-latest
      native: ${{ needs.native-windows.outputs.artifact }}
      types: ${{ needs.static.outputs.types }}
      local: ${{ needs.local-windows.outputs.artifact }}
  heavy:
    name: heavy results
    needs: [changes, heavy-linux, heavy-macos, heavy-windows]
    if: always() && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .node-version }
      - run: node tools/ci/dedup-routing.mjs platforms
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          PLATFORM_LAYER: heavy
  runtime-package:
    name: runtime package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - run: pnpm --filter @agnes/cli build:runtime
      - run: pnpm --filter @agnes/daemon build:runtime
      # This source-level Host test loads native seams outside the packaged extension runner, and
      # Vitest's global setup requires both native products (tools/native-test-setup.mjs).
      - name: build source native modules for assembly acceptance
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @agnes/host build:native
          pnpm --filter @agnes/system-node build:native
      - name: exercise opt-in assembly with packaged runtime
        if: runner.os == 'macOS'
        run: pnpm exec vitest run packages/host/test/assemble/enabled-packages.test.ts
        env:
          AGNES_TEST_RUNTIME_DIRECTORY: packages/cli/dist/agnes-runtime
      - run: pnpm --filter @agnes/cli pack --pack-destination .agnes-tmp/packs
      - run: pnpm --filter @agnes/daemon pack --pack-destination .agnes-tmp/packs
      - name: verify source tree is unchanged
        run: git diff --exit-code
  sea:
    name: SEA (${{ matrix.target }})
    needs: [changes, static, check]
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64, binary: agnes-darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64, binary: agnes-linux-x64 }
          - { os: windows-2022, target: win32-x64, binary: agnes-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      # The smokes run real sessions under the required L1 sandbox. The Ubuntu image ships no
      # bubblewrap, and its AppArmor policy blocks the unprivileged user namespaces bwrap needs.
      - name: Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          bash tools/e2e-web/provision-linux-sandbox.sh
      - name: prepare Windows native headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      # The SEA smokes run under Vitest, whose global setup requires the test native helpers.
      - run: pnpm --filter @agnes/host build:native
      - run: pnpm --filter @agnes/system-node build:native
      - run: pnpm --filter @agnes/cli build:sea
      - name: verify Linux ABI and SHA-256 in Node, workers and SEA on Debian 11
        if: runner.os == 'Linux'
        run: |
          node --test tools/native/check-glibc.test.mjs
          node packages/cli/sea/build-native-smoke.mjs "$RUNNER_TEMP/agnes-native-smoke"
          docker run --rm --network=none -v "$PWD/packages/cli/dist/sea:/dist:ro" -v "$PWD/tools/native:/probe:ro" debian:bullseye-slim /dist/runtime/node /probe/crypto-smoke.cjs /dist/node_modules/@agnes/system-node/dist/native/agnes-system.node
          docker run --rm --network=none -v "$PWD/packages/cli/dist/sea:/dist:ro" -v "$RUNNER_TEMP/agnes-native-smoke:/probe:ro" debian:bullseye-slim /probe/crypto-smoke /dist/node_modules/@agnes/system-node/dist/native/agnes-system.node
      - name: smoke production commands, extensions and native runtime
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.e2e.test.ts sea/windows-runtime.test.ts
        env:
          AGNES_SEA_BIN: dist/sea/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      # The executable needs its daemon, worker, web assets and Node/native runtime beside it.
      # Tar also preserves executable permissions for the macOS/Linux distribution.
      - name: archive complete SEA runtime
        run: tar --exclude=sea-loader-smoke-* -czf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea .
      - name: extract distribution for delivery acceptance
        run: |
          node -e "require('node:fs').mkdirSync('packages/cli/dist/sea-unpacked', {recursive:true})"
          tar -xzf packages/cli/dist/agnes-${{ matrix.target }}.tar.gz -C packages/cli/dist/sea-unpacked
      - name: smoke extracted distribution
        run: pnpm --filter @agnes/cli exec vitest run sea/smoke.e2e.test.ts sea/windows-runtime.test.ts sea/web-distribution.test.ts --maxWorkers=1
        env:
          AGNES_SEA_BIN: dist/sea-unpacked/${{ matrix.binary }}
          AGNES_SEA_LOADER_HARNESS: dist/sea/sea-loader-smoke-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agnes-${{ matrix.target }}
          path: packages/cli/dist/agnes-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  result:
    name: CI result
    if: always()
    needs: [changes, static, native-linux, native-macos, native-windows, local-linux, local-macos, local-windows, linux-fast, check, windows-check-result, heavy, runtime-package, sea, web, web-result]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version }
      - name: require every selected job to pass
        run: node tools/ci/result.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

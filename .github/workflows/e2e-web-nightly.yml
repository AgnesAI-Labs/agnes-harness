name: Web E2E manual full suite
# The daily 02:00 Asia/Shanghai run is owned by ci.yml (18:00 UTC).
# Keep this existing entry point for an explicit full-browser run on a chosen ref.
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  browsers:
    uses: ./.github/workflows/e2e-web.yml
    with: { suite: nightly }

name: Prepare local package
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      native: { type: string, required: true }
      types: { type: string, required: true }
      artifact: { type: string, default: '' }
    outputs:
      artifact: { value: '${{ jobs.prepare.outputs.artifact }}' }
      build-ms: { value: '${{ jobs.prepare.outputs.build-ms }}' }
      pack-ms: { value: '${{ jobs.prepare.outputs.pack-ms }}' }
      upload-ms: { value: '${{ jobs.prepare.outputs.upload-ms }}' }
      archive-bytes: { value: '${{ jobs.prepare.outputs.archive-bytes }}' }
permissions: { contents: read }
env: { AGNES_NATIVE_BUILDER: glibc228 }
defaults:
  run: { shell: bash }
jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      build-ms: ${{ steps.build.outputs.duration-ms }}
      pack-ms: ${{ steps.pack.outputs.duration-ms }}
      upload-ms: ${{ steps.uploaded.outputs.duration-ms }}
      archive-bytes: ${{ steps.pack.outputs.archive-bytes }}
    steps:
      - id: identity
        env: { EXISTING: '${{ inputs.artifact }}', LOCAL_RUNNER: '${{ inputs.runner }}' }
        run: echo "artifact=${EXISTING:-prepared-local-${LOCAL_RUNNER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "$GITHUB_OUTPUT"
      - name: Preserve repository line endings
        if: inputs.artifact == ''
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.artifact == ''
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: inputs.artifact == ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.artifact == ''
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: inputs.artifact == ''
      - run: pnpm run doctor:toolchain
        if: inputs.artifact == ''
      - name: Prepare Windows native headers
        if: inputs.artifact == '' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-native.ps1 -CacheRoot "$env:RUNNER_TEMP/agnes-node-headers"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.artifact == ''
        with:
          name: ${{ inputs.native }}
          path: .agnes-tmp/prepared-native
      - name: Restore and load native helpers
        if: inputs.artifact == ''
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.artifact == ''
        with:
          name: ${{ inputs.types }}
          path: .agnes-tmp/prepared-types
      - run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-types
        if: inputs.artifact == ''
      - id: build
        name: Build local package and preparation proof
        if: inputs.artifact == ''
        run: node tools/ci/build-sharing-benchmark.mjs measure build tools/e2e-web/ci.mjs prepare --prepared-local packages/cli/dist/local/.ci-preparation
      - id: pack
        name: Pack local package
        if: inputs.artifact == ''
        run: |
          node tools/ci/build-sharing-benchmark.mjs measure pack tools/ci/prepared-artifact.mjs pack local .agnes-tmp/prepared-local
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `archive-bytes=${require("node:fs").statSync(".agnes-tmp/prepared-local/payload.tar").size}\n`)'
      - id: uploading
        if: inputs.artifact == ''
        run: node tools/ci/build-sharing-benchmark.mjs timestamp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.artifact == ''
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .agnes-tmp/prepared-local
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - id: uploaded
        if: inputs.artifact == ''
        env:
          BENCHMARK_STARTED: ${{ steps.uploading.outputs.started }}
        run: node tools/ci/build-sharing-benchmark.mjs elapsed "$BENCHMARK_STARTED"
      - name: Verify source tree is unchanged
        if: inputs.artifact == ''
        run: git diff --exit-code

name: Platform heavy
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      native: { type: string, required: true }
      types: { type: string, required: true }
permissions: { contents: read }
env: { AGNES_NATIVE_BUILDER: glibc228 }
jobs:
  heavy:
    name: heavy (${{ inputs.runner }} ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        # With the sandbox, shells, built CLI and Chromium provisioned, one Linux runner needed
        # 45-60 minutes for the whole tier. Shards 1 and 2 are the file lists in
        # tools/ci/heavy-shards.json, each about 20 minutes of measured Linux file time; shard 3 runs
        # every other heavy file, so each file runs in exactly one shard.
        shard: [1, 2, 3]
    runs-on: ${{ inputs.runner }}
    # Matches the check job. Windows runs its heavy files one at a time.
    timeout-minutes: 60
    steps:
      - name: preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The upgrade gate archives pinned earlier plugin-core commits.
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      # Hosted Windows runners keep the workspace and RUNNER_TEMP on the D: work disk, but TEMP
      # defaults to the C: system disk. Tests put their stores, ledgers, locks and flushes under
      # os.tmpdir(), so they share the system disk with everything else on the VM.
      # One number per disk in the log, so a slow run can be told apart from a slow disk.
      - name: measure flushed writes on the Windows system and work disks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @'
          const fs = require('node:fs'), path = require('node:path')
          for (const root of process.argv.slice(1)) {
            const dir = fs.mkdtempSync(path.join(root, 'flush-'))
            const started = performance.now()
            for (let i = 0; i < 200; i++) fs.writeFileSync(path.join(dir, `f${i}`), 'x'.repeat(4096), { flush: true })
            console.log(`${root}: ${((performance.now() - started) / 200).toFixed(2)} ms per flushed 4 KiB write`)
            fs.rmSync(dir, { recursive: true, force: true })
          }
          '@
          node -e $script -- $env:TEMP $env:RUNNER_TEMP
      # Like the per-user Temp it replaces, the folder grants only this user, SYSTEM and
      # Administrators, so the private homes and stores tests create under it pass validation.
      # RUNNER_TEMP itself inherits the D: drive's broad grants.
      - name: keep temporary files on the Windows work disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'private-temp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $temp /inheritance:r /grant:r "*${user}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot make the temporary folder private' }
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.native }}
          path: .agnes-tmp/prepared-native
      - name: Restore and load native helpers
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.types }}
          path: .agnes-tmp/prepared-types
      - run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-types
      # Heavy tests confine real sessions, MCP children and candidate tests with bubblewrap, and
      # drive a persistent zsh. The Ubuntu image ships neither, and its AppArmor policy blocks the
      # unprivileged user namespaces bwrap needs; the script authorizes only /usr/bin/bwrap.
      - name: Linux sandbox and shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap zsh
          bash tools/e2e-web/provision-linux-sandbox.sh
      # The demo, agent-sweep and built-distribution gates start packages/cli/dist/local.
      - run: pnpm --filter @agnes/cli build:local
      # The multi-tab transport and agent-sweep tests launch the pinned Playwright Chromium.
      - name: provision pinned Chromium
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # Source-worker tests share jiti's transpile cache (packages/daemon/test/source-transpile-cache.ts).
      # jiti re-transpiles any file whose source hash changed, so an older cache is safe to restore.
      - name: Restore source transpile cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: node_modules/.cache/agnes-source-transpile
          key: source-transpile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: source-transpile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      # A cache restore may miss. Compile the trusted official graph before source-worker startup
      # deadlines; each real worker still imports/evaluates it through the production loader.
      - name: Prepare source transpile cache
        timeout-minutes: 5
        run: pnpm exec tsx tools/ci/prepare-source-transpile.ts
      # Run real-process files one at a time on each shard, leaving capacity for their children,
      # source transforms and durable I/O. Tests retain their own concurrent clients and processes.
      # The Windows files run separately below are held out here.
      - name: test heavy tier
        env:
          AGNES_TEST_EXCLUDE: ${{ runner.os == 'Windows' && 'packages/daemon/test/skill-install-requests.slow.test.ts,packages/daemon/test/conversation-mcp.e2e.test.ts,packages/cli/test/acp-concurrency.e2e.test.ts,packages/cli/test/dbh-m06-ephemeral-leak.e2e.test.ts,packages/daemon/test/service-worker.e2e.test.ts,packages/cli/test/built-resource-mcp.e2e.test.ts' || '' }}
        run: node tools/ci/run-heavy-shard.mjs --shard=${{ matrix.shard }}/3 --maxWorkers=1
      - name: Save source transpile cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: node_modules/.cache/agnes-source-transpile
          key: source-transpile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ github.sha }}-${{ matrix.shard }}
      # The ACP cold-start bound measures concurrent CLI processes. Run it without other Vitest
      # files competing for this runner's cores, while retaining its original assertion.
      - name: Windows ACP cold-start concurrency
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/cli/test/acp-concurrency.e2e.test.ts --maxWorkers=1
      # The source CLI fixture cold-loads the test Host; keep its 20-second initialization
      # deadline meaningful by running it without other Vitest files on this Windows runner.
      - name: Windows ephemeral CLI lifecycle
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/cli/test/dbh-m06-ephemeral-leak.e2e.test.ts --maxWorkers=1
      # These heavy files drive real worker, MCP server and built CLI processes under fixed startup and
      # shutdown deadlines; run each alone so parallel Vitest files do not starve them.
      - name: Windows service worker boundary
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/daemon/test/service-worker.e2e.test.ts --maxWorkers=1
      - name: Windows built CLI managed MCP lifecycle
        if: runner.os == 'Windows' && matrix.shard == 3
        run: pnpm exec vitest run packages/cli/test/built-resource-mcp.e2e.test.ts --maxWorkers=1
      - name: Upload failed heavy browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heavy-browser-${{ inputs.runner }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agnes-tmp/e2e-web
            !.agnes-tmp/e2e-web/**/.playwright-artifacts-*/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: verify working tree is clean
        run: git diff --exit-code

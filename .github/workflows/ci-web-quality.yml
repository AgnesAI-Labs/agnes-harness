name: Web platform quality
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      types: { type: string, required: true }
      native: { type: string, required: true }
permissions: { contents: read }
env:
  AGNES_NATIVE_BUILDER: glibc228
jobs:
  quality:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run doctor:toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.types }}
          path: .agnes-tmp/prepared-types
      - run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-types
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.native }}
          path: .agnes-tmp/prepared-native
      - name: Restore and load native helpers
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: node tools/e2e-web/ci.mjs quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-quality-${{ inputs.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agnes-tmp/e2e-web
          include-hidden-files: true
          if-no-files-found: warn

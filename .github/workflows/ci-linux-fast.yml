name: Linux fast
on:
  workflow_call:
    inputs:
      types: { type: string, required: true }
      native: { type: string, required: true }
permissions: { contents: read }
env: { AGNES_NATIVE_BUILDER: glibc228 }
jobs:
  linux-fast:
    name: Linux fast tests (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6] }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The guards compare allowances with the protected merge-base and the bundled-version
        # check with origin/<base branch>; both need full history, as in ci.yml.
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      # The completion tests load the generated script in real bash and zsh; the Ubuntu image has no zsh.
      - name: Native toolchain, bubblewrap and zsh
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 bubblewrap zsh
      - name: Provision actual Linux sandbox namespaces
        run: bash tools/e2e-web/provision-linux-sandbox.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run doctor:toolchain
        id: install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.native }}
          path: .agnes-tmp/prepared-native
      - name: Restore and load native helpers
        run: |
          node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-native
          node --input-type=module -e "import setup from './tools/native-test-setup.mjs'; setup()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.types }}
          path: .agnes-tmp/prepared-types
      - run: node tools/ci/prepared-artifact.mjs restore .agnes-tmp/prepared-types
      # Reserve capacity for Vite/IPC on 2–4 vCPU runners. Six independent shards bound
      # retained module graphs and heap pressure without changing the 5s test deadline.
      - name: Runner capacity
        run: node tools/ci/test-timings.mjs
      - name: Fast tests (zero retries)
        run: /usr/bin/time -v pnpm test --pool=forks --shard=${{ matrix.shard }}/6 --reporter=default --reporter=json --reporter=./tools/guards/src/zero-test-reporter.mjs --outputFile.json=.agnes-tmp/ci-fast/timing.json
      - name: Slow fast-tier cases
        if: always()
        run: node tools/ci/test-timings.mjs .agnes-tmp/ci-fast/timing.json
      - name: Upload per-case durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-timings-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agnes-tmp/ci-fast
          include-hidden-files: true
          if-no-files-found: error
